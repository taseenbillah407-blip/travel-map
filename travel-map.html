<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমার বাংলাদেশ ভ্রমণ</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Hind Siliguri',sans-serif;
    background:#eef7f1;
    color:#173d2c;
}

.box{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 25px #0001;
}

h1{
    text-align:center;
    margin:0;
    font-size:30px;
}

.sub{
    text-align:center;
    color:#777;
    margin:5px 0 15px;
}

.counter{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#07844a;
}

.map{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:15px;
}

.district{
    border:1px solid #c9d8cf;
    background:#f5faf7;
    padding:10px 4px;
    border-radius:9px;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
}

.district.selected{
    background:#07844a;
    color:white;
    border-color:#07844a;
}

input{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:inherit;
    font-size:16px;
}

button{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#07844a;
    color:white;
    font-family:inherit;
    font-size:17px;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:20px;
    padding:25px;
    border-radius:18px;
    background:#e9f6ed;
    text-align:center;
}

.result h2{
    margin:0;
}

.result strong{
    font-size:35px;
    color:#07844a;
}

@media(max-width:500px){
    .map{
        grid-template-columns:repeat(3,1fr);
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="box">

<div class="card">

<h1>🇧🇩 আমার বাংলাদেশ</h1>

<div class="sub">
আপনি বাংলাদেশের কোন কোন জেলায় ভ্রমণ করেছেন?
</div>

<div class="counter">
<span id="total">0</span> / 64
</div>

<div class="map" id="districtMap"></div>

<input
id="name"
type="text"
placeholder="আপনার নাম লিখুন">

<input
id="photo"
type="file"
accept="image/*">

<button onclick="createCard()">
আমার ভ্রমণ কার্ড তৈরি করুন
</button>

<div class="result" id="result">

<h2 id="resultName"></h2>

<p>
আমি বাংলাদেশের
</p>

<strong>
<span id="resultTotal">0</span> / 64
</strong>

<p>
টি জেলা ভ্রমণ করেছি 🇧🇩
</p>

</div>

</div>

</div>


<script>

const districts = [

"ঢাকা",
"ফরিদপুর",
"গাজীপুর",
"গোপালগঞ্জ",
"জামালপুর",
"কিশোরগঞ্জ",
"মাদারীপুর",
"মানিকগঞ্জ",
"মুন্সিগঞ্জ",
"ময়মনসিংহ",
"নারায়ণগঞ্জ",
"নরসিংদী",
"নেত্রকোণা",
"রাজবাড়ী",
"শরীয়তপুর",
"শেরপুর",
"টাঙ্গাইল",

"বগুড়া",
"জয়পুরহাট",
"নওগাঁ",
"নাটোর",
"চাঁপাইনবাবগঞ্জ",
"পাবনা",
"রাজশাহী",
"সিরাজগঞ্জ",

"দিনাজপুর",
"গাইবান্ধা",
"কুড়িগ্রাম",
"লালমনিরহাট",
"নীলফামারী",
"পঞ্চগড়",
"রংপুর",
"ঠাকুরগাঁও",

"বরগুনা",
"বরিশাল",
"ভোলা",
"ঝালকাঠি",
"পটুয়াখালী",
"পিরোজপুর",

"বান্দরবান",
"ব্রাহ্মণবাড়িয়া",
"চাঁদপুর",
"চট্টগ্রাম",
"কুমিল্লা",
"কক্সবাজার",
"ফেনী",
"খাগড়াছড়ি",
"লক্ষ্মীপুর",
"নোয়াখালী",
"রাঙ্গামাটি",

"হবিগঞ্জ",
"মৌলভীবাজার",
"সুনামগঞ্জ",
"সিলেট",

"বাগেরহাট",
"চুয়াডাঙ্গা",
"যশোর",
"ঝিনাইদহ",
"খুলনা",
"কুষ্টিয়া",
"মাগুরা",
"মেহেরপুর",
"নড়াইল",
"সাতক্ষীরা"

];

let selected = new Set();

const map = document.getElementById("districtMap");

districts.forEach((district,index)=>{

    const button = document.createElement("button");

    button.className = "district";

    button.textContent = district;

    button.type = "button";

    button.onclick = function(){

        if(selected.has(index)){

            selected.delete(index);

            button.classList.remove("selected");

        }else{

            selected.add(index);

            button.classList.add("selected");

        }

        document.getElementById("total")
        .textContent = selected.size;

    };

    map.appendChild(button);

});


function createCard(){

    const name =
    document.getElementById("name").value.trim();

    if(!name){

        alert("আপনার নাম লিখুন");

        return;
    }

    document.getElementById("resultName")
    .textContent = name;

    document.getElementById("resultTotal")
    .textContent = selected.size;

    document.getElementById("result")
    .style.display = "block";

}

</script>

</body>
</html>
