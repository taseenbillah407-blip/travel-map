<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
      maximum-scale=1, user-scalable=no">

<title>আমার বাংলাদেশ ভ্রমণ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#eee9dc;
  color:#173b2b;
  font-family:"Hind Siliguri",sans-serif;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:10px;
}


/* =========================
   HEADER
========================= */

.header{
  background:#fff;
  border-radius:18px;
  padding:16px;
  text-align:center;
  margin-bottom:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header h1{
  margin:0;
  font-size:24px;
  font-weight:700;
}

.header p{
  margin:4px 0 0;
  color:#777;
  font-size:14px;
}


/* =========================
   USER FORM
========================= */

.form{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

input[type="text"]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-family:inherit;
  font-size:16px;
}

input[type="file"]{
  width:100%;
  margin-top:9px;
  font-family:inherit;
  font-size:14px;
}


/* =========================
   DIVISION PANEL
========================= */

.district-panel{
  background:#fff;
  border-radius:18px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.panel-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}


/* Division */

.division{
  border:1px solid #e0dbcf;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:8px;
}

.division:last-child{
  margin-bottom:0;
}

.division-title{
  background:#f3eee3;
  padding:11px 12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.arrow{
  font-size:13px;
  transition:.2s;
}

.division.open .arrow{
  transform:rotate(180deg);
}


/* District buttons */

.districts{
  display:none;
  padding:9px;
  background:#fff;
  flex-wrap:wrap;
  gap:6px;
}

.division.open .districts{
  display:flex;
}

.district-btn{
  border:1px solid #d8d3c7;
  background:#fff;
  color:#333;
  border-radius:9px;
  padding:7px 9px;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

.district-btn.selected{
  background:#31945a;
  color:#fff;
  border-color:#31945a;
}


/* =========================
   MAP CARD
========================= */

.map-card{
  background:#e9e1cf;
  border-radius:20px;
  padding:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);
  overflow:hidden;
}


/* User info */

.top{
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 6px 9px;
}

.photo{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#d8d0bd;
  border:3px solid #fff;
  flex:none;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:20px;
  font-weight:700;
  line-height:1.2;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.count{
  color:#687267;
  font-size:15px;
  margin-top:1px;
}

.progress{
  height:7px;
  background:#d1c8b5;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#277a49;
  transition:width .15s;
}


/* =========================
   MAP
========================= */

.map-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

#map{
  display:block;
  width:100%;
  height:auto;
  max-height:650px;
  touch-action:none;
}

.district{
  fill:#f5f0e4;
  stroke:#fff;
  stroke-width:.8;
  vector-effect:non-scaling-stroke;
}

.district.selected{
  fill:#31945a;
}

.label{
  pointer-events:none;
  fill:#26382d;
  font-size:6.5px;
  font-weight:600;
  text-anchor:middle;
}

.dot{
  pointer-events:none;
  fill:#d74b42;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:35px 10px;
  color:#777;
  font-size:15px;
}

.error{
  text-align:center;
  padding:30px 10px;
  color:#b33;
}


/* =========================
   BOTTOM
========================= */

.bottom{
  text-align:center;
  padding:7px 4px 3px;
}

.bottom strong{
  font-size:16px;
}

.bottom small{
  display:block;
  color:#777;
  margin-top:1px;
}


/* =========================
   DOWNLOAD BUTTON
========================= */

.download{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin-top:10px;
  background:#237547;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.download:active{
  transform:scale(.98);
}

.download:disabled{
  opacity:.7;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

  .container{
    padding:7px;
  }

  .header h1{
    font-size:22px;
  }

  .photo{
    width:52px;
    height:52px;
  }

  .name{
    font-size:18px;
  }

  .district-btn{
    font-size:13px;
    padding:6px 8px;
  }

  .label{
    font-size:5.7px;
  }
}

</style>
</head>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>🇧🇩 আমার বাংলাদেশ ভ্রমণ</h1>

    <p>
      আপনি যে জেলাগুলো ভ্রমণ করেছেন সেগুলো নির্বাচন করুন

      <small>
        🇧🇩 বাংলাদেশ ভ্রমণ মানচিত্র

    </div>

  </div>


  <!-- DOWNLOAD -->

  <button

    class="download">

    📥 ছবি হিসেবে সংরক্ষণ

</div>

/* =====================================================
   VARIABLES
===================================================== */

const selected = new Set();

const svg =
  d3.select("#map");

const width = 500;
const height = 650;


/* =====================================================
   NAME INPUT
===================================================== */

document
.getElementById("nameInput")
.addEventListener("input", function(){

  document
  .getElementById("name")
  .textContent =
    this.value.trim() || "আপনার নাম";

});


/* =====================================================
   PHOTO
===================================================== */

document
.getElementById("photoInput")
.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    document
    .getElementById("photo")
    .src = e.target.result;

  };

  reader.readAsDataURL(file);

});


/* =====================================================
   CREATE DIVISION LIST
===================================================== */

function createDivisionList(){

  const box =
    document.getElementById("divisionList");

  box.innerHTML = "";


  Object.entries(divisions)
  .forEach(([division, districts]) => {


    const wrapper =
      document.createElement("div");

    wrapper.className = "division";


    const title =
      document.createElement("div");

    title.className =
      "division-title";


    title.innerHTML = `

      <span>${division}</span>

      <span class="arrow">▼</span>

    `;


    const districtBox =
      document.createElement("div");

    districtBox.className =
      "districts";


    districts.forEach(name => {


      const button =
        document.createElement("button");

      button.className =
        "district-btn";

      button.textContent =
        name;

      button.dataset.district =
        name;


      button.addEventListener(
        "click",
        function(){

          toggleDistrict(name);

        }
      );


      districtBox.appendChild(button);

    });


    title.addEventListener(
      "click",
      function(){

        wrapper.classList.toggle("open");

      }
    );


    wrapper.appendChild(title);

    wrapper.appendChild(districtBox);

    box.appendChild(wrapper);

  });

}


/* =====================================================
   SELECT / UNSELECT DISTRICT
===================================================== */

function toggleDistrict(name){

  if(selected.has(name)){

    selected.delete(name);

  }else{

    selected.add(name);

  }


  /*
     Update buttons
  */

  document
  .querySelectorAll(".district-btn")
  .forEach(button => {

    button.classList.toggle(
      "selected",
      selected.has(
        button.dataset.district
      )
    );

  });


  /*
     Update map
  */

  svg
  .selectAll(".district")
  .classed(
    "selected",
    d => {

      const name =
        getEnglishName(d);

      const bangla =
        BN[name] || name;

      return selected.has(bangla);

    }
  );


  updateCount();

}


/* =====================================================
   COUNT
===================================================== */

function updateCount(){

  const number =
    selected.size;


  document
  .getElementById("count")
  .textContent =
    number;


  document
  .getElementById("total")
  .textContent =
    number;


  document
  .getElementById("progressBar")
  .style.width =
    ((number / 64) * 100) + "%";

}


/* =====================================================
   GET ENGLISH DISTRICT NAME
===================================================== */

function getEnglishName(feature){

  const p =
    feature.properties || {};

  return (
    p.ADM2_EN ||
    p.NAME_2 ||
    p.NAME_1 ||
    p.name ||
    p.district ||
    p.DISTRICT ||
    ""
  ).trim();

}


/* =====================================================
   LOAD MAP
===================================================== */

async function loadMap(){

  try{


    const response =
      await fetch(
        GEO_URL,
        {
          cache:"force-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "GeoJSON could not load"
      );

    }


    const geojson =
      await response.json();


    /*
       Projection
    */

    const projection =
      d3.geoMercator()
      .fitSize(
        [
          width - 20,
          height - 20
        ],
        geojson
      );


    const path =
      d3.geoPath()
      .projection(projection);


    svg
    .attr(
      "viewBox",
      `0 0 ${width} ${height}`
    );


    /*
       DRAW DISTRICTS

       এখানে click নেই।
       অর্থাৎ ম্যাপে চাপ দিয়ে
       জেলা select করা যাবে না।
    */

    svg
    .selectAll(".district")
    .data(geojson.features)
    .enter()
    .append("path")
    .attr(
      "class",
      "district"
    )
    .attr(
      "d",
      path
    );


    /*
       DISTRICT LABEL
    */

    svg
    .selectAll(".label")
    .data(geojson.features)
    .enter()
    .append("text")
    .attr(
      "class",
      "label"
    )
    .attr(
      "x",
      d => {

        const c =
          path.centroid(d);

        return c[0];

      }
    )
    .attr(
      "y",
      d => {

        const c =
          path.centroid(d);

        return c[1] + 2;

      }
    )
    .text(
      d => {

        const name =
          getEnglishName(d);

        return BN[name] || name;

      }
    );


    /*
       RED DOT
    */

    svg
    .selectAll(".dot")
    .data(geojson.features)
    .enter()
    .append("circle")
    .attr(
      "class",
      "dot"
    )
    .attr(
      "r",
      1.7
    )
    .attr(
      "cx",
      d => {

        const c =
          path.centroid(d);

        return c[0];

      }
    )
    .attr(
      "cy",
      d => {

        const c =
          path.centroid(d);

        return c[1] - 5;

      }
    );


    /*
       SHOW MAP
    */

    document
    .getElementById("loading")
    .style.display =
      "none";


    svg
    .style("display","block");


  }catch(error){


    console.error(error);


    const loading =
      document.getElementById("loading");


    loading.className =
      "error";


    loading.textContent =
      "❌ ম্যাপ লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।";

  }

}


/* =====================================================
   DOWNLOAD
===================================================== */

document
.getElementById("downloadBtn")
.addEventListener(
  "click",
  async function(){

    const button = this;


    button.disabled =
      true;

    button.textContent =
      "⏳ ছবি তৈরি হচ্ছে...";


    try{


      /*
         html2canvas শুধু
         Download চাপলে load হবে।
         এতে ফোনে আগেই RAM খরচ হবে না।
      */

      if(!window.html2canvas){


        await new Promise(
          (resolve,reject) => {


            const script =
              document.createElement(
                "script"
              );


            script.src =
              "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";


            script.onload =
              resolve;

            script.onerror =
              reject;


            document.head
              .appendChild(script);

          }
        );

      }


      const canvas =
        await html2canvas(
          document.getElementById(
            "mapCard"
          ),
          {
            scale:2,
            backgroundColor:
              "#e9e1cf",
            useCORS:true
          }
        );


      const link =
        document.createElement(
          "a"
        );


      link.download =
        "my-bangladesh-travel-map.png";


      link.href =
        canvas.toDataURL(
          "image/png"
        );


      link.click();


    }catch(error){


      console.error(error);


      alert(
        "ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।"
      );

    }


    button.disabled =
      false;

    button.textContent =
      "📥 ছবি হিসেবে সংরক্ষণ";

  }
);


/* =====================================================
   START

createDivisionList();

updateCount();

loadMap();

</script>
