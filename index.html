<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>বাংলাদেশ ভ্রমণ মানচিত্র</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#eee9dc;
  font-family:"Hind Siliguri",sans-serif;
  color:#173b2b;
}

.container{
  width:min(100%,520px);
  margin:auto;
  padding:12px;
}

/* Header */
.header{
  background:#fff;
  border-radius:18px;
  padding:16px;
  text-align:center;
  box-shadow:0 3px 15px #00000012;
  margin-bottom:12px;
}

.header h1{
  margin:0;
  font-size:25px;
  font-weight:700;
}

.header p{
  margin:4px 0 0;
  color:#777;
  font-size:14px;
}

/* Form */
.form{
  background:#fff;
  border-radius:18px;
  padding:15px;
  box-shadow:0 3px 15px #00000012;
  margin-bottom:12px;
}

input[type="text"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  font-family:inherit;
  font-size:16px;
  outline:none;
}

input[type="file"]{
  width:100%;
  margin-top:10px;
  font-family:inherit;
}

/* Map Card */
.map-card{
  background:#e9e1cf;
  border-radius:20px;
  padding:10px;
  box-shadow:0 4px 18px #00000016;
  overflow:hidden;
}

.top{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 7px 10px;
}

.photo{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#d8d0bd;
  border:3px solid #fff;
  flex:none;
}

.info{
  flex:1;
}

.name{
  font-size:20px;
  font-weight:700;
  line-height:1.1;
}

.count{
  font-size:15px;
  color:#687267;
  margin-top:2px;
}

.progress{
  height:7px;
  background:#d1c8b5;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#277a49;
  transition:width .15s linear;
}

/* SVG */
.map-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

svg{
  display:block;
  width:100%;
  height:auto;
  max-height:650px;
  touch-action:manipulation;
}

.district{
  fill:#f5f0e4;
  stroke:#ffffff;
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
}

.district.selected{
  fill:#31945a;
}

.district:active{
  opacity:.75;
}

.label{
  pointer-events:none;
  fill:#26382d;
  font-size:7px;
  font-weight:600;
  text-anchor:middle;
}

.dot{
  pointer-events:none;
  fill:#d74b42;
}

/* Bottom */
.bottom{
  text-align:center;
  padding:8px 5px 3px;
}

.bottom strong{
  font-size:16px;
}

.bottom small{
  display:block;
  color:#777;
  margin-top:2px;
}

/* Button */
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin-top:10px;
  background:#237547;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
}

button:active{
  transform:scale(.98);
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#777;
  font-size:15px;
}

.error{
  text-align:center;
  padding:25px 10px;
  color:#b33;
}

/* Mobile */
@media(max-width:380px){
  .container{
    padding:8px;
  }

  .header h1{
    font-size:22px;
  }

  .name{
    font-size:18px;
  }

  .photo{
    width:52px;
    height:52px;
  }

  .label{
    font-size:6px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🇧🇩 আমার বাংলাদেশ ভ্রমণ</h1>
    <p>যে জেলাগুলো ঘুরেছেন সেগুলো নির্বাচন করুন</p>
  </div>

  <div class="form">

    <input
      id="nameInput"
      type="text"
      placeholder="আপনার নাম লিখুন"
      maxlength="40"
    >

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

  </div>

  <div class="map-card" id="mapCard">

    <div class="top">

      <img
        id="photo"
        class="photo"
        alt=""
      >

      <div class="info">

        <div class="name" id="name">
          আপনার নাম
        </div>

        <div class="count">
          <span id="count">0</span>/64 জেলা
        </div>

        <div class="progress">
          <div
            id="progressBar"
            class="progress-bar"
          ></div>
        </div>

      </div>

    </div>

    <div class="map-wrap">

      <div
        id="loading"
        class="loading"
      >
        🗺️ বাংলাদেশের মানচিত্র লোড হচ্ছে...
      </div>

      <svg
        id="map"
        viewBox="0 0 500 650"
        style="display:none"
      ></svg>

    </div>

    <div class="bottom">

      <strong>
        মোট <span id="total">0</span> জেলা ভ্রমণ
      </strong>

      <small>
        🇧🇩 Unseen Bangladesh
      </small>

    </div>

  </div>

  <button id="downloadBtn">
    📥 ছবি হিসেবে সংরক্ষণ
  </button>

</div>


<!-- Lightweight D3 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>

const GEO_URL =
"https://raw.githubusercontent.com/yasserius/bangladesh_geojson_shapefile/master/small/small_bangladesh_geojson_adm2_64_districts_zillas.json";


/* বাংলা নাম */

const BN = {

"Dhaka":"ঢাকা",
"Faridpur":"ফরিদপুর",
"Gazipur":"গাজীপুর",
"Gopalganj":"গোপালগঞ্জ",
"Jamalpur":"জামালপুর",
"Kishoreganj":"কিশোরগঞ্জ",
"Madaripur":"মাদারীপুর",
"Manikganj":"মানিকগঞ্জ",
"Munshiganj":"মুন্সিগঞ্জ",
"Mymensingh":"ময়মনসিংহ",
"Narayanganj":"নারায়ণগঞ্জ",
"Narsingdi":"নরসিংদী",
"Netrokona":"নেত্রকোনা",

"Bogra":"বগুড়া",
"Joypurhat":"জয়পুরহাট",
"Naogaon":"নওগাঁ",
"Natore":"নাটোর",
"Chapainawabganj":"চাঁপাইনবাবগঞ্জ",
"Pabna":"পাবনা",
"Rajshahi":"রাজশাহী",
"Sirajganj":"সিরাজগঞ্জ",

"Dinajpur":"দিনাজপুর",
"Gaibandha":"গাইবান্ধা",
"Kurigram":"কুড়িগ্রাম",
"Lalmonirhat":"লালমনিরহাট",
"Nilphamari":"নীলফামারী",
"Panchagarh":"পঞ্চগড়",
"Rangpur":"রংপুর",
"Thakurgaon":"ঠাকুরগাঁও",

"Habiganj":"হবিগঞ্জ",
"Moulvibazar":"মৌলভীবাজার",
"Sunamganj":"সুনামগঞ্জ",
"Sylhet":"সিলেট",

"Barisal":"বরিশাল",
"Barguna":"বরগুনা",
"Bhola":"ভোলা",
"Jhalokati":"ঝালকাঠি",
"Patuakhali":"পটুয়াখালী",
"Pirojpur":"পিরোজপুর",

"Bandarban":"বান্দরবান",
"Brahmanbaria":"ব্রাহ্মণবাড়িয়া",
"Chandpur":"চাঁদপুর",
"Chattogram":"চট্টগ্রাম",
"Comilla":"কুমিল্লা",
"Cox's Bazar":"কক্সবাজার",
"Feni":"ফেনী",
"Khagrachhari":"খাগড়াছড়ি",
"Lakshmipur":"লক্ষ্মীপুর",
"Noakhali":"নোয়াখালী",
"Rangamati":"রাঙ্গামাটি",

"Bagerhat":"বাগেরহাট",
"Chuadanga":"চুয়াডাঙ্গা",
"Jessore":"যশোর",
"Jhenaidah":"ঝিনাইদহ",
"Khulna":"খুলনা",
"Kushtia":"কুষ্টিয়া",
"Magura":"মাগুরা",
"Meherpur":"মেহেরপুর",
"Narail":"নড়াইল",
"Satkhira":"সাতক্ষীরা"

};


const svg =
d3.select("#map");

const selected =
new Set();

const width = 500;
const height = 650;


/* নাম */

document
.getElementById("nameInput")
.addEventListener("input", function(){

  document
  .getElementById("name")
  .textContent =
  this.value.trim() || "আপনার নাম";

});


/* ছবি */

document
.getElementById("photoInput")
.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    document
    .getElementById("photo")
    .src = e.target.result;

  };

  reader.readAsDataURL(file);

});


/* কাউন্টার */

function updateCount(){

  const n = selected.size;

  document
  .getElementById("count")
  .textContent = n;

  document
  .getElementById("total")
  .textContent = n;

  document
  .getElementById("progressBar")
  .style.width =
  ((n / 64) * 100) + "%";

}


/* জেলা ম্যাপ */

async function loadMap(){

  try{

    const response =
      await fetch(GEO_URL, {
        cache:"force-cache"
      });

    if(!response.ok)
      throw new Error("GeoJSON error");

    const geojson =
      await response.json();


    /*
      map projection
      একবারই তৈরি হবে
    */

    const projection =
      d3.geoMercator()
      .fitSize(
        [width - 20, height - 20],
        geojson
      );


    const path =
      d3.geoPath()
      .projection(projection);


    svg
      .attr("viewBox",
            `0 0 ${width} ${height}`);


    /*
      জেলা
    */

    svg
    .selectAll(".district")
    .data(geojson.features)
    .enter()
    .append("path")
    .attr("class","district")
    .attr("d",path)
    .attr("data-name",d => {

      return getName(d);

    })
    .on("click",function(event,d){

      event.preventDefault();

      const name =
        getName(d);

      if(selected.has(name)){

        selected.delete(name);

        d3.select(this)
          .classed("selected",false);

      }else{

        selected.add(name);

        d3.select(this)
          .classed("selected",true);

      }

      updateCount();

    });


    /*
      label
    */

    svg
    .selectAll(".label")
    .data(geojson.features)
    .enter()
    .append("text")
    .attr("class","label")
    .attr("x",d =>
      path.centroid(d)[0]
    )
    .attr("y",d =>
      path.centroid(d)[1] + 2
    )
    .text(d =>
      BN[getName(d)] || getName(d)
    );


    /*
      ছোট লাল dot
    */

    svg
    .selectAll(".dot")
    .data(geojson.features)
    .enter()
    .append("circle")
    .attr("class","dot")
    .attr("r",1.8)
    .attr("cx",d =>
      path.centroid(d)[0]
    )
    .attr("cy",d =>
      path.centroid(d)[1] - 5
    );


    document
      .getElementById("loading")
      .style.display="none";

    svg
      .style("display","block");


  }catch(error){

    console.error(error);

    document
      .getElementById("loading")
      .className="error";

    document
      .getElementById("loading")
      .textContent =
      "❌ ম্যাপ লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।";

  }

}


/* জেলা নাম বের করা */

function getName(feature){

  const p =
    feature.properties || {};

  return (
    p.ADM2_EN ||
    p.NAME_2 ||
    p.name ||
    p.district ||
    p.DISTRICT ||
    ""
  )
  .trim();

}


/* ছবি ডাউনলোড */

document
.getElementById("downloadBtn")
.addEventListener("click", async function(){

  const button = this;

  button.disabled = true;
  button.textContent = "⏳ ছবি তৈরি হচ্ছে...";

  try{

    /*
      html2canvas শুধু
      button চাপার সময় লোড হবে।
      তাই ফোনে সবসময় RAM খাবে না।
    */

    if(!window.html2canvas){

      await new Promise((resolve,reject)=>{

        const script =
        document.createElement("script");

        script.src =
        "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";

        script.onload=resolve;
        script.onerror=reject;

        document.head.appendChild(script);

      });

    }


    const canvas =
      await html2canvas(
        document.getElementById("mapCard"),
        {
          scale:2,
          backgroundColor:"#e9e1cf",
          useCORS:true
        }
      );


    const link =
      document.createElement("a");

    link.download =
      "bangladesh-travel-map.png";

    link.href =
      canvas.toDataURL("image/png");

    link.click();


  }catch(error){

    alert("ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।");

    console.error(error);

  }

  button.disabled = false;
  button.textContent =
    "📥 ছবি হিসেবে সংরক্ষণ";

});


/* Start */

loadMap();

updateCount();

</script>

</body>
</html>
